[info]
name         = "Batch Values"
version      = "1.0.2"
description  = "Bulk edit items, item sets and media: add, remove, replace, find and replace, split, join and clean up values; change visibility, language, data type, template, owner, item sets, sites and thumbnails; reorder media and make page images from PDFs. Every run is previewed first, logged, and can be cancelled later."
tags         = "batch edit, bulk edit, find and replace, values, curation, undo"
license      = "GPL-3.0-or-later"
author       = "Phumraphee Sae-tang"
author_link  = "https://github.com/phumraphee"
module_link  = "https://github.com/phumraphee/BatchValues"
support_link = "https://github.com/phumraphee/BatchValues/issues"
configurable = true
omeka_version_constraint = "^4.0.0"
